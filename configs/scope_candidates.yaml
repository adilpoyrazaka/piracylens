# Parameters for owner scope candidate generation.
# Fixed before any candidate list was produced. Later changes are logged with a reason
# and reported as sensitivity checks; they are not applied silently.
# All thresholds below are heuristic choices, counted on requests from window.start onward.

window:
  start: "2021-01-01"

sources:
  # Owners ranked by request volume (normalized owner keys).
  ranking:
    min_requests: 5000

  # Owners served by the Russian TV protection network (reporter groups or normalized keys).
  protection_network:
    reporters: ["contentscan", "f6", "starmedia", "vindex"]
    # Counted on the owner's requests filed through these reporters, not on the owner's
    # total volume. Clarified before any candidate list was produced.
    min_owner_requests: 500

  # Reporters that mainly handle film/TV. The seed share (share of a reporter's requests
  # that belong to seed owners) is only an aid: the decision is made by hand.
  film_tv_agencies:
    min_reporter_requests: 50000
    seed_share: 0.5
    # Counted on the owner's requests filed through the selected film/TV agencies, not on
    # the owner's total volume. Clarified before any candidate list was produced.
    min_owner_requests: 500

  # Prefix scan over normalized owner keys. Prefixes are written in normalized form.
  # "prefix": plain startswith. "word": the prefix must not be followed by a letter or digit.
  # Rule: names of 4 characters or fewer, or common words, use "word".
  prefix_scan:
    min_requests: 5
