# Pre-registered design of the takedown audit model.
# Fixed before any label rate or model output was looked at. Later changes are logged
# with a date and a reason and reported separately from the main result.
# Dates refer to the request filing time (requested_at_utc, UTC) and are inclusive.

data:
  table: "data/interim/scoped_domains.parquet"
  window_start: "2021-01-01"
  data_end: "2026-10-24"
  # Rows earlier than the window are feature history only, never training examples.
  history_start: "2019-01-01"

population:
  # Only rows where Google decided at least one URL; not-in-index and pending are dropped.
  decided_counters: ["urls_removed", "urls_no_action"]

label:
  # Primary label: Google took no action on at least one URL of the domain in the request.
  primary: {counter: "urls_no_action", min_count: 1}
  # Sensitivity label, fixed together with the primary one so neither is picked after a look:
  # share of decided URLs with no action is at least this value (heuristic).
  sensitivity_min_share: 0.5

split:
  train: {start: "2021-01-01", end: "2024-12-31"}
  validation: {start: "2025-01-01", end: "2025-06-30"}
  test: {start: "2025-07-01", end: "2026-10-24"}
  # Grouping unit for folds inside training and for bootstrap resampling.
  group_by: "domain"
  # The test set is also reported on domains never seen before the test start.
  report_unseen_domains: true
  # Validation and test metrics are also reported separately for rows with and without
  # domain history (a decided request on the domain filed at least the gap below earlier).
  report_by_history: true

features:
  # A domain's past no-action rate uses only requests filed at least this many days
  # earlier, because the decision date is not in the data (heuristic).
  past_rate_min_gap_days: 30
  # History comes from every owner's requests in the full domains table from data.history_start,
  # not only from the scoped owners: how Google treated a domain for others is known at filing.
  past_rate_history: "full_domains_table"
  # Rows without history keep the past rate missing and get a has_domain_history flag;
  # models that cannot take missing values use the training base rate instead.
  no_history: "missing_with_flag"
  # Model inputs, fixed before the feature builder exists. Every input is known when the
  # request is filed; none depends on Google's decision about the request itself.
  inputs:
    # Domain name: character n-grams and its shape.
    - "domain_ngrams"
    - "tld"
    - "domain_length"
    - "domain_labels"
    - "domain_digit_share"
    - "domain_hyphens"
    - "domain_punycode"
    # Request size: domains in the request, URLs in the request, URLs for this domain.
    - "domains_in_request"
    - "urls_in_request"
    - "urls_for_domain"
    # Owner side.
    - "owner_group"
    - "market"
    - "content_type"
    - "region"
    # Reporter side: group and brand separately, plus whether the owner filed for itself.
    - "reporter_group"
    - "reporter_brand"
    - "self_filed"
    # Domain history (rules above) and the domain's age: days since it first appeared in any
    # request filed strictly earlier, from the same table and start date as the history.
    - "domain_past_rate"
    - "has_domain_history"
    - "domain_past_requests"
    - "domain_age_days"
    - "has_domain_age"
  # Character n-gram settings for the domain name; the vocabulary is fitted on training
  # only (heuristic values).
  domain_ngrams: {analyzer: "char_wb", min_n: 3, max_n: 5, min_df: 5, sublinear_tf: true}
  # Top-level domain, owner group, reporter group and reporter brand keep their most
  # frequent training values; the rest and unseen values become "other" (heuristic).
  categorical_top_k: 50
  # Request-size counts use every domain row of the request, decided or not: which rows
  # are decided depends on the outcome, so counting only those would leak it.
  request_size_rows: "all"
  # A request is self-filed when its reporter is one of the owner names of the request's
  # own owner group, so a brand filing for its parent also counts.
  self_filed_level: "owner_group"
  # Never used as features: the URL-level file, an undocumented column, raw free-text
  # names, the single URL counters (Google's outcome; one of them is the label), scoping
  # artifacts, and the filing date itself (a model trained on earlier years cannot read a
  # later date; time enters through the domain history and age instead).
  excluded:
    - "url_file"
    - "from_abuser"
    - "owner_name"
    - "reporter_name"
    - "urls_removed"
    - "urls_not_in_index"
    - "urls_no_action"
    - "urls_pending"
    - "evidence_basis"
    - "source_flags"
    - "requested_at_utc"

sampling:
  # Training examples are whole requests (all of their domains). The size is set by a
  # memory measurement that reads no label, and is written here before any model runs;
  # training refuses to run while it is empty.
  train_unit: "request"
  train_requests: null
  # Validation and test keep the real class rate: no rebalancing.
  rebalance_eval: false
  seed: 20261104

models:
  baselines: ["base_rate", "domain_past_rate"]
  candidates: ["logistic_regression", "linear_svm_sgd", "xgboost"]
  imbalance_variants: ["none", "class_weight"]
  calibration: "isotonic"
  # The domain past-rate baseline predicts the training base rate for rows without history.
  past_rate_fallback: "train_base_rate"
  # Hyperparameters and the decision threshold are tuned on validation only;
  # the test set is evaluated once, at the end.
  tune_on: "validation"

metrics:
  primary: "pr_auc"
  others: ["recall_at_precision", "brier"]
  precision_target: 0.80
  bootstrap: {resamples: 1000, unit: "domain", confidence: 0.95}

business_metric:
  # At the precision target: share and count of test no-action URLs that would have been
  # flagged before the notice was filed.
  name: "preventable_no_action_urls"
  at_precision: 0.80

checks:
  # Same validation and test sets, training restricted to requests from this date.
  stability_train_start: "2023-01-01"
  excluded_groups: ["vgtrk"]
  # Per-group metrics are reported for groups with at least this many test rows (heuristic).
  per_group_min_test_rows: 1000
  reporter_ablation: true
  # Owners that entered the scope through the owner ranking or the prefix scan only.
  source_subset: ["source_a", "source_d"]
  no_reporter_model: true
  # A drop in PR-AUC larger than this (absolute) counts as a large gap (heuristic).
  large_gap_pr_auc: 0.05

# Change log
# 2026-11-05: added split.report_by_history, features.past_rate_history, features.no_history
# and models.past_rate_fallback, before any label rate or model output was looked at. A
# label-blind size measurement showed that most test rows have no earlier history for their
# domain, so how the past rate is computed and reported without history had to be fixed.
# 2026-11-05: added features.inputs, domain_ngrams, categorical_top_k, request_size_rows
# and self_filed_level, and extended features.excluded, before the feature builder existed
# and before any label rate or model output was looked at. Two inputs come from label-blind
# volume measurements: owners filing for themselves (about 7% of requests in every split)
# and the age of a domain, which is known even when the domain has no decided history.
